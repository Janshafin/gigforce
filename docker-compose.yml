version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gigforge_postgres
    restart: always
    environment:
      POSTGRES_USER: gigforge_user
      POSTGRES_PASSWORD: gigforge_password
      POSTGRES_DB: gigforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigforge_user -d gigforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
